name: Platform audit checks
on:
  pull_request:
    paths: ["audit/**", ".github/workflows/audit-checks.yml"]
  push:
    branches: ["feat/zhaopengwang/platform-audit", "master"]
    paths: ["audit/**", ".github/workflows/audit-checks.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: audit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: audit/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt -e .
      - run: ruff format --check src tests && ruff check src tests --select E9,F63,F7,F82,F401
      - name: Generate isolated test credentials
        run: |
          python - <<'PY'
          import os, secrets
          values = {"AWS_ACCESS_KEY_ID": "audit" + secrets.token_hex(8), "AWS_SECRET_ACCESS_KEY": secrets.token_hex(32)}
          with open(os.environ["GITHUB_ENV"], "a") as f:
              for name, value in values.items():
                  print("::add-mask::" + value)
                  f.write(name + "=" + value + "\n")
          PY
      - name: Start dedicated loopback Object Lock fixture
        run: |
          docker run -d --name audit-s3 -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data --address :9000
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          exit 1
      - name: Unit and real Object Lock integration
        env:
          AUDIT_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"
        run: python -m pytest -q
      - name: Verify container build
        run: docker build -t platform-audit:ci .
      - name: Validate independent compose
        run: |
          cp config.example.toml config.toml
          mkdir -p "$RUNNER_TEMP/audit-sources"
          touch "$RUNNER_TEMP/audit-writer" "$RUNNER_TEMP/audit-cleaner"
          AUDIT_SOURCE_DIR="$RUNNER_TEMP/audit-sources" \
          AUDIT_WRITER_CREDENTIALS_FILE="$RUNNER_TEMP/audit-writer" \
          AUDIT_CLEANER_CREDENTIALS_FILE="$RUNNER_TEMP/audit-cleaner" \
            docker compose config --quiet
      - if: always()
        run: docker rm -f audit-s3 || true
